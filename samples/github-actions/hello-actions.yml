# Sample kelas. Salin ke .github/workflows/hello-actions.yml di repo latihan.
name: Lab 1 - Hello Actions
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hello:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Sapa peserta
        run: echo "Halo dari GitHub Actions"
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Lihat isi repository
        run: ls -la
