name: Deploy React Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-demo-production
  cancel-in-progress: false

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/react-demo
  IMAGE_TAG: sha-${{ github.sha }}
  CONTAINER_NAME: react-demo
  DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '8081' }}

jobs:
  build-and-push:
    name: Build dan Push Image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login ke Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build dan push image
        uses: docker/build-push-action@v7
        with:
          context: ./react-demo
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=react-demo
          cache-to: type=gha,mode=max,scope=react-demo

  deploy:
    name: Deploy ke Server
    needs: build-and-push
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}

    steps:
      - name: Deploy melalui SSH
        uses: appleboy/ssh-action@v1
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          IMAGE_TAG: ${{ env.IMAGE_TAG }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          DEPLOY_PORT: ${{ env.DEPLOY_PORT }}
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_NAME,IMAGE_TAG,CONTAINER_NAME,DEPLOY_PORT,DOCKER_USERNAME,DOCKERHUB_TOKEN
          script: |
            set -eu

            if docker info >/dev/null 2>&1; then
              docker_cmd() {
                docker "$@"
              }
            elif sudo -n docker info >/dev/null 2>&1; then
              docker_cmd() {
                sudo -n docker "$@"
              }
            else
              echo "User SSH tidak memiliki akses ke Docker."
              echo "Tambahkan user ke grup docker atau izinkan sudo Docker tanpa password."
              exit 1
            fi

            printf '%s' "$DOCKERHUB_TOKEN" |
              docker_cmd login -u "$DOCKER_USERNAME" --password-stdin

            docker_cmd pull "$IMAGE_NAME:$IMAGE_TAG"

            old_image="$(
              docker_cmd inspect --format='{{.Image}}' "$CONTAINER_NAME" 2>/dev/null ||
                true
            )"

            docker_cmd rm --force "$CONTAINER_NAME" 2>/dev/null || true

            docker_cmd run --detach \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              --publish "$DEPLOY_PORT:80" \
              "$IMAGE_NAME:$IMAGE_TAG"

            healthy=false
            attempt=1

            while [ "$attempt" -le 12 ]; do
              if curl --fail --silent \
                "http://127.0.0.1:$DEPLOY_PORT/" >/dev/null; then
                healthy=true
                break
              fi

              sleep 5
              attempt=$((attempt + 1))
            done

            if [ "$healthy" != "true" ]; then
              echo "Health check gagal."
              docker_cmd logs "$CONTAINER_NAME" || true
              docker_cmd rm --force "$CONTAINER_NAME" 2>/dev/null || true

              if [ -n "$old_image" ]; then
                docker_cmd run --detach \
                  --name "$CONTAINER_NAME" \
                  --restart unless-stopped \
                  --publish "$DEPLOY_PORT:80" \
                  "$old_image"
                echo "Rollback ke image sebelumnya berhasil."
              else
                echo "Tidak ada image sebelumnya untuk rollback."
              fi

              exit 1
            fi

            docker_cmd image prune --force
            echo "Deploy $IMAGE_NAME:$IMAGE_TAG berhasil."

      - name: Tulis deployment summary
        run: |
          {
            echo "## React Demo berhasil di-deploy"
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Image: \`${IMAGE_NAME}:${IMAGE_TAG}\`"
            echo "- Port: \`${DEPLOY_PORT}\`"
          } >> "$GITHUB_STEP_SUMMARY"
